[project]
name = "mcp-sentinel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ritik Budhathoki", email = "rititkbt01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.4.0",
    "pydantic>=2.9.0",
    "typer>=0.13.0",
    "rich>=13.9.0",
    "jinja2>=3.1.0",
    "libcst>=1.5.0",
]

[project.scripts]
mcp-sentinel = "mcp_sentinel:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
    "ruff>=0.7.0",
    "pip-audit>=2.7.0",
    "bandit>=1.8.0",
    "semgrep>=1.90.0",
    "pre-commit>=4.6.2",
]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: integration tests requiring sandbox or corpus",
]
